name: Fetch World Cup Scores Live

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes automatically
  workflow_dispatch:      # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch API and generate data.json
        env:
          WORLD_CUP_API_BASE_URL: ${{ secrets.WORLD_CUP_API_BASE_URL }}
          WORLD_CUP_API_KEY: ${{ secrets.WORLD_CUP_API_KEY }}
        run: node fetch-data.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Automated feed update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push